plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.picka.smombieapp'
    compileSdk 36

    defaultConfig {
        applicationId "com.picka.smombieapp"
        minSdk 23
        targetSdk 36
        versionCode 5
        versionName "1.1.2"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // 서명 정보는 깃에 안 올리는 keystore.properties에서 읽는다
    def keystoreFile = rootProject.file('keystore.properties')
    if (keystoreFile.exists()) {
        def ks = new Properties()
        keystoreFile.withInputStream { ks.load(it) }
        signingConfigs {
            release {
                storeFile file(ks['storeFile'])
                storePassword ks['storePassword']
                keyAlias ks['keyAlias']
                keyPassword ks['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            if (keystoreFile.exists()) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    packaging {
        resources.excludes += 'META-INF/DEPENDENCIES.txt'
        resources.excludes += 'META-INF/LICENSE.txt'
        resources.excludes += 'META-INF/NOTICE.txt'
        resources.excludes += 'META-INF/NOTICE'
        resources.excludes += 'META-INF/LICENSE'
        resources.excludes += 'META-INF/DEPENDENCIES'
        resources.excludes += 'META-INF/notice.txt'
        resources.excludes += 'META-INF/license.txt'
        resources.excludes += 'META-INF/dependencies.txt'
        resources.excludes += 'META-INF/LGPL2.1'

    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'


    implementation "org.apache.poi:poi:3.17"
    implementation "org.apache.poi:poi-ooxml:3.17"
    implementation "org.apache.poi:poi-ooxml-schemas:3.17"
    implementation "org.apache.poi:poi-scratchpad:3.17"
    implementation "org.apache.xmlbeans:xmlbeans:3.0.0"
    implementation 'javax.xml.stream:stax-api:1.0'
    implementation 'com.fasterxml:aalto-xml:1.0.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.0.0'

    implementation 'org.jsoup:jsoup:1.11.3'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}